<script>
/* Standalone curator access panel. Access settings are local until Supabase is configured. */
(function(){
 const key='milliy_curator_settings_v1';
 const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}}};
 const write=v=>localStorage.setItem(key,JSON.stringify(v));
 const settings=read();
 const launch=document.createElement('button');
 launch.className='milliy-curator-launch';launch.type='button';launch.textContent='Kurator kabineti';
 document.body.appendChild(launch);
 const overlay=document.createElement('div');overlay.className='milliy-curator-overlay';
 overlay.innerHTML=`<section class="milliy-curator-card" role="dialog" aria-modal="true" aria-label="Kurator kabineti">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Kurator kabineti</h2><p style="margin:0">O‘quvchilar, materiallar va kirish ruxsatlarini boshqarish</p></div><button class="secondary" data-close>Yopish</button></div>
 <div id="mc-login"><div class="milliy-curator-note">Kurator akkauntingiz bilan kiring.</div>
 <div class="milliy-curator-grid"><div><label>Kurator email</label><input id="mc-email" type="email" autocomplete="username" placeholder="kurator@maktab.uz"></div><div><label>Parol</label><input id="mc-pass" type="password" autocomplete="current-password" placeholder="Supabase Auth paroli"></div></div>
 <button id="mc-signin">Kirish</button><span id="mc-status" aria-live="polite"></span></div>
 <div id="mc-dashboard" hidden>
 <div class="milliy-curator-note">Holatni o‘zgartirish tugmalari ushbu brauzerda saqlanadi. Umumiy o‘quvchilar uchun serverda kuchga kirishi uchun SQL sxemasi va Supabase CRUD integratsiyasi sozlangan bo‘lishi kerak.</div>
 <div class="milliy-curator-grid"><div><strong>Platforma holati</strong><p id="mc-site-state">Tekshirilmoqda</p><button id="mc-site-toggle">Platformaga kirishni o‘zgartirish</button></div><div><strong>O‘quvchilar kirishi</strong><p id="mc-student-state">Tekshirilmoqda</p><button id="mc-student-toggle">O‘quvchilar kirishini o‘zgartirish</button></div></div>
 <h3>O‘quvchilar profillari</h3>
 <p>Bu ro‘yxat Supabase’dan jonli yuklanadi. O‘quvchi o‘z profilini yoki sertifikatlarini saqlasa, shu yerda ko‘rinadi.</p>
 <button id="mc-refresh-students" class="secondary" type="button">Ro‘yxatni yangilash</button><div id="mc-student-status" class="milliy-curator-note" aria-live="polite">Yuklash kutilmoqda…</div><div id="mc-student-profiles" class="milliy-curator-list"></div>
 <h3>Materiallar ro‘yxati</h3><label>Material nomi</label><input id="mc-material-title" placeholder="Masalan, IELTS Mock Test">
 <label>Fayl biriktirish</label><input id="mc-file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png">
 <button id="mc-add-material">Materialni ro‘yxatga qo‘shish</button><ul class="milliy-curator-list" id="mc-materials"></ul>
 <h3>Diagnostika va mashg‘ulotlar</h3><p>RIASEC kasb diagnostikasi, IELTS/MOCK testlari, Hard Skills va Soft Skills taqdimotlarini material sifatida joylang. Har bir o‘quvchining natijalarini alohida saqlash uchun Supabase jadvali va RLS siyosatlari kerak.</p>
 <button id="mc-signout" class="secondary">Chiqish</button>
 </div>
 <div style="margin-top:14px"><button class="secondary" data-close>Yopish</button></div></section>`;
 document.body.appendChild(overlay);
 const $=id=>overlay.querySelector('#'+id);
 let client=null,session=null;
 function status(t){$('mc-status').textContent=t}
 function getState(){return Object.assign({siteOpen:true,studentsOpen:true,materials:[]},read())}
 function render(){
   const s=getState();
   $('mc-site-state').textContent=s.siteOpen?'Ochiq':'Yopiq';
   $('mc-student-state').textContent=s.studentsOpen?'Ruxsat berilgan':'Bloklangan';
   $('mc-site-toggle').textContent=s.siteOpen?'Platformani yopish':'Platformani ochish';
   $('mc-student-toggle').textContent=s.studentsOpen?'O‘quvchilarni bloklash':'O‘quvchilarga ruxsat berish';
   const list=$('mc-materials');list.innerHTML='';
   s.materials.forEach((m,i)=>{const li=document.createElement('li');const span=document.createElement('span');span.textContent=m.title+(m.file?' — '+m.file:'');const b=document.createElement('button');b.className='secondary';b.textContent='O‘chirish';b.onclick=()=>{const x=getState();x.materials.splice(i,1);write(x);render()};li.append(span,b);list.appendChild(li)});
 }
 async function loadSupabase(){
   if (typeof window.getSupabaseClient === 'function') {
     client = await window.getSupabaseClient();
     return client;
   }
   if (window.supabaseClient) {
     client = window.supabaseClient;
     return client;
   }
   throw new Error('Supabase SDK yuklanmadi. Internetni tekshiring va index.html bilan supabase.js bir papkada ekanini tekshiring.');
 }
 const mcEsc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function loadStudentProfiles(){
   const box=$('mc-student-profiles'),label=$('mc-student-status');
   if(!box||!client||!session){if(label)label.textContent='Kurator akkauntiga kiring.';return}
   label.textContent='O‘quvchilar yuklanmoqda…';box.innerHTML='';
   try{
     const {data:profiles,error}=await client.from('student_profiles').select('user_id,email,full_name,class_name,about,interests,photo_path,updated_at').order('updated_at',{ascending:false});
     if(error)throw error;
     if(!profiles||!profiles.length){label.textContent='Hozircha o‘quvchilar profilini saqlamagan.';return}
     label.textContent='Topildi: '+profiles.length+' ta o‘quvchi.';
     for(const p of profiles){

       let photo='';if(p.photo_path){const r=await client.storage.from('student-files').createSignedUrl(p.photo_path,3600);if(!r.error)photo=r.data.signedUrl}
       const card=document.createElement('section');card.style.cssText='border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin:10px 0;background:#fff;color:#0f172a';
       const interests=Array.isArray(p.interests)?p.interests.join(', '):'';
       const certHtml=(certs||[]).map(c=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0;padding:8px;background:#f8fafc;border-radius:8px"><span style="flex:1;min-width:120px"><strong>${mcEsc(c.title||c.file_name)}</strong><br><small>${mcEsc(c.file_name||'Fayl')}</small></span><button type="button" data-mc-cert="${mcEsc(c.id)}" data-mc-path="${mcEsc(c.file_path)}">Ochish</button></div>`).join('')||'<p style="color:#64748b">Sertifikatlar yo‘q.</p>';
       card.innerHTML=`<div style="display:flex;gap:12px;align-items:center">${photo?`<img src="${mcEsc(photo)}" alt="Profil rasmi" style="width:64px;height:64px;border-radius:12px;object-fit:cover">`:'<div style="width:64px;height:64px;border-radius:12px;background:#ecfdf5;display:grid;place-items:center;font-size:24px">👤</div>'}<div><strong style="font-size:16px">${mcEsc(p.full_name||'Ism kiritilmagan')}</strong><div style="color:#64748b;font-size:12px">${mcEsc(p.class_name||'Sinf ko‘rsatilmagan')} · ${mcEsc(p.email||'')}</div></div></div><p style="white-space:pre-wrap">${mcEsc(p.about||'O‘zi haqida ma’lumot kiritmagan.')}</p><p><strong>Qiziqishlar:</strong> ${mcEsc(interests||'Ko‘rsatilmagan')}</p><details><summary>Sertifikatlar (${(certs||[]).length})</summary>${certHtml}</details><small style="color:#64748b">Yangilangan: ${mcEsc(p.updated_at?new Date(p.updated_at).toLocaleString():'—')}</small>`;
       box.appendChild(card);
     }
     box.querySelectorAll('[data-mc-cert]').forEach(b=>b.onclick=async()=>{const r=await client.storage.from('student-files').createSignedUrl(b.dataset.mcPath,3600);if(r.error){label.textContent='Fayl ochilmadi: '+r.error.message;return}window.open(r.data.signedUrl,'_blank','noopener')});
   }catch(e){label.textContent='Xatolik: '+(e.message||String(e))+' — SQL sxemasi va RLS sozlamalarini tekshiring.';console.error('Student profiles:',e)}
 }
 launch.onclick=()=>{overlay.style.display='flex';render()};

$('mc-signin').onclick = async () => {
  try {
    status('Kirish tekshirilmoqda…');

    await loadSupabase();

    const email = $('mc-email').value.trim();
    const password = $('mc-pass').value;

    if (!email || !password) {
      throw new Error('Email va parolni kiriting.');
    }

    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    const { data: roleData, error: roleError } = await client
      .from('user_roles')
      .select('role')
      .eq('user_id', data.user.id)
      .eq('role', 'curator')
      .maybeSingle();

    if (roleError) {
      await client.auth.signOut();
      throw roleError;
    }

    if (!roleData) {
      await client.auth.signOut();
      throw new Error(
        'Kurator roli topilmadi. Supabase user_roles jadvalini tekshiring.'
      );
    }

    session = data.session;

    $('mc-login').hidden = true;
    $('mc-dashboard').hidden = false;

    status('Kirish muvaffaqiyatli');
    render();
    await loadStudentProfiles();

  } catch (e) {
    status(e.message || 'Kirish amalga oshmadi.');
    console.error('Kurator login xatosi:', e);
  }
};

 // Remove the old in-app "download site" / "export site" entry points, without hiding ordinary file downloads.
 const hideExport=()=>{document.querySelectorAll('button,[role="button"],a').forEach(el=>{const t=((el.innerText||el.textContent||'')+' '+(el.title||'')).toLowerCase();if((t.includes('saytni yuklab olish')||t.includes('sayt arxivini')||t.includes('download website')||t.includes('скачать сайт')||t.includes('скачать архив сайта')||t.includes('sayt fayllarini yuklab olish')||t.includes('выгрузить сайт')||t.includes('deploy / export zip')||t.includes('export zip'))&&!el.classList.contains('milliy-curator-launch'))el.remove()})};
 new MutationObserver(hideExport).observe(document.documentElement,{childList:true,subtree:true,attributes:true});

<script>
(function () {
  function removeExportButtons() {
    document.querySelectorAll('button, a, input[type="button"], input[type="submit"]').forEach(function (el) {
      const text = (el.innerText || el.value || el.getAttribute('aria-label') || '').trim().toLowerCase();

      if (
        text.includes('выгрузить сайт') ||
        text.includes('экспорт сайта') ||
        text.includes('export site') ||
        text.includes('download site') ||
        text.includes('deploy / export zip') ||
        text.includes('saytni yuklab olish') ||
        text.includes('скачать сайт')
      ) {
        el.remove();
      }
    });
  }

  removeExportButtons();

  const observer = new MutationObserver(removeExportButtons);
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
</script>
